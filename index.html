<!doctype html>
<html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SB Vocational Training Centre</title><link rel="stylesheet" href="style.css"><link rel="icon" href="assets/IMG-20261102-WA0023.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head><body>
<header><div class="topbar"><img class="logo" src="assets/IMG-20261102-WA0023.jpg" alt="SB logo">
<div><h1 id="centre-name">SB Vocational Training Centre</h1><p>জাপানি ভাষা শিক্ষা কেন্দ্র</p></div>
<div class="lang"><button data-lang="bn" onclick="setLang('bn')">বাংলা</button><button data-lang="en" onclick="setLang('en')">English</button><button data-lang="ja" onclick="setLang('ja')">日本語</button></div>
</div>
<nav>
<button data-view="home" class="active" onclick="show('home')" data-t="home">হোম</button>
<button data-view="courses" onclick="show('courses')" data-t="courses">কোর্সসমূহ</button>
<button data-view="search" onclick="show('search')" data-t="search">শিক্ষার্থী খুঁজুন</button>
<button data-view="verify" onclick="show('verify')" data-t="verify">সার্টিফিকেট যাচাই</button>
<button data-view="gallery" onclick="show('gallery')" data-t="gallery">গ্যালারি</button>
<button data-view="notice" onclick="show('notice')" data-t="notice">নোটিশ</button>
<button data-view="teacher" onclick="show('teacher')" data-t="teacher">শিক্ষক</button>
<button data-view="ach" onclick="show('ach')" data-t="ach">অর্জনসমূহ</button>
<button data-view="story" onclick="show('story')" data-t="story">সাফল্যের গল্প</button>
<button data-view="about" onclick="show('about')" data-t="about">আমাদের সম্পর্কে</button>
<a class="btn secondary" href="admin.html" data-t="admin" style="margin-left:auto">অ্যাডমিন</a>
</nav></header>
<main>
<div id="setup-note"></div>
<section id="view-home" class="active">
<div class="hero"><h2 id="hero-title"></h2><p id="hero-sub"></p>
<p><a class="btn" href="#" onclick="show('courses');return false;" data-t="courses">কোর্সসমূহ</a>
<a class="btn secondary" href="#" onclick="show('verify');return false;" data-t="verify">সার্টিফিকেট যাচাই</a></p></div>
<div id="slideshow" style="margin-top:16px"></div>
</section>
<section id="view-courses"><h2 data-t="courses">কোর্সসমূহ</h2><div id="courses-grid" class="grid"></div></section>
<section id="view-search"><h2 data-t="search">শিক্ষার্থী খুঁজুন</h2>
<div class="card"><input id="search-input" data-ph="searchHint" placeholder="রোল নম্বর বা নাম লিখুন">
<button class="btn" onclick="doSearch()" data-t="searchBtn">খুঁজুন</button><div id="search-result"></div></div></section>
<section id="view-verify"><h2 data-t="verify">সার্টিফিকেট যাচাই</h2>
<div class="card"><input id="verify-input" data-ph="verifyHint" placeholder="লাইসেন্স নম্বর লিখুন">
<button class="btn" onclick="doVerify()" data-t="verifyBtn">যাচাই করুন</button><div id="verify-result"></div></div></section>
<section id="view-gallery"><h2 data-t="gallery">গ্যালারি</h2><div id="gallery-grid" class="grid"></div></section>
<section id="view-notice"><h2 data-t="notice">নোটিশ</h2><div id="notices-list"></div></section>
<section id="view-teacher"><h2 data-t="teacher">শিক্ষক</h2><div id="teacher-box"></div></section>
<section id="view-ach"><h2 data-t="ach">অর্জনসমূহ</h2><div id="ach-list"></div></section>
<section id="view-story"><h2 data-t="story">সাফল্যের গল্প</h2><div id="story-list"></div></section>
<section id="view-about"><h2 data-t="about">আমাদের সম্পর্কে</h2><div class="card"><p id="about-text"></p></div></section>
</main>
<footer><div class="wrap">
<p><b>SB Vocational Training Centre</b></p>
<p><a id="fb-link" href="https://www.facebook.com/share/1DsnbitRCE/" target="_blank" rel="noopener">Facebook</a>
&nbsp;•&nbsp;<a id="wa-link" href="#" target="_blank" rel="noopener">WhatsApp</a></p>
<p id="foot-contact"></p>
</div></footer>
<script src="config.js"></script><script src="app.js"></script>
</body></html>
